
slides:
  - title:
      text: "Roller Coaster Basics"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Roller coasters are thrilling rides that use physics principles to create exciting experiences. Let's explore the basics of roller coaster physics!"
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "\\text{Potential Energy (PE) = mgh}"
          alignment: "middle"
      - type: plot_graph
        args:
          points: [[0,0],[10,100],[10,0]]
          x_label: "Distance (m)"
          y_label: "Potential Energy (J)"
          title: "Potential Energy vs. Distance"
          scale: 1.5
          alignment: "middle"

  - title:
      text: "Gravity and Roller Coasters"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Gravity pulls objects towards the ground. Roller coasters use this force to create thrilling drops and hills. Let's explore how gravity affects roller coaster motion!"
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "\\text{F_g = m*g}"
          alignment: "middle"
      - type: plot_graph
        args:
          points: [[0,0],[10,10],[10,0]]
          x_label: "Distance (m)"
          y_label: "Force (N)"
          title: "Gravity's Force on a Roller Coaster"
          scale: 1.5
          alignment: "middle"

  - title:
      text: "Potential and Kinetic Energy"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Potential energy is energy an object has due to its position, while kinetic energy is energy an object has due to its motion. Let's see how these energies relate to roller coasters!"
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "\\text{KE = 0.5*m*v^2}"
          alignment: "middle"
      - type: plot_graph
        args:
          points: [[0,0],[10,50],[10,55],[0,55]]
          x_label: "Distance (m)"
          y_label: "Total Energy (J)"
          title: "Potential and Kinetic Energy on a Roller Coaster"
          scale: 1.5
          alignment: "middle"

  - title:
      text: "Roller Coaster Friction"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Friction is the force that opposes motion between two surfaces. Let's explore how friction affects roller coaster motion and how riders experience forces!"
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "\\text{F_f = μ*F_n}"
          alignment: "middle"
      - type: plot_graph
        args:
          points: [[0,0],[10,10],[10,0],[15,5],[15,0]]
          x_label: "Distance (m)"
          y_label: "Force (N)"
          title: "Friction on a Roller Coaster"
          scale: 1.5
          alignment: "middle"

  - title:
      text: "Roller Coaster Forces"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Roller coasters create exciting forces for riders. Let's explore the forces involved in a roller coaster ride, including normal force, friction, and gravity!"
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "\\text{F_n = m*g}"
          alignment: "middle"
      - type: plot_graph
        args:
          points: [[0,0],[10,10],[10,0],[15,15],[15,10]]
          x_label: "Distance (m)"
          y_label: "Force (N)"
          title: "Roller Coaster Forces"
          scale: 1.5
          alignment: "middle"

  - title:
      text: "Roller Coaster Rolling Friction"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Rolling friction is the force that opposes the motion of an object that is in contact with a surface and is rolling. Let's explore how rolling friction affects roller coaster motion!"
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "\\text{F_r = μ_r*F_n}"
          alignment: "middle"
      - type: plot_graph
        args:
          points: [[0,0],[10,5],[10,0],[15,2],[15,0]]
          x_label: "Distance (m)"
          y_label: "Force (N)"
          title: "Rolling Friction on a Roller Coaster"
          scale: 1.5
          alignment: "middle"

  - title:
      text: "Roller Coaster Air Resistance"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Air resistance is the force that opposes the motion of an object moving through a fluid, like air. Let's explore how air resistance affects roller coaster motion!"
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "\\text{F_a = 0.5*ρ*v^2*A}"
          alignment: "middle"
      - type: plot_graph
        args:
          points: [[0,0],[10,1],[10,0],[15,2],[15,0]]
          x_label: "Distance (m)"
          y_label: "Force (N)"
          title: "Air Resistance on a Roller Coaster"
          scale: 1.5
          alignment: "middle"

  - title:
      text: "Roller Coaster Energy Conservation"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Energy conservation is the principle that the total energy of a system remains constant if no energy is added or removed. Let's explore how energy conservation applies to roller coasters!"
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "\\text{PE_initial = KE_final}"
          alignment: "middle"
      - type: plot_graph
        args:
          points: [[0,100],[10,50],[10,55],[0,55]]
          x_label: "Distance (m)"
          y_label: "Total Energy (J)"
          title: "Energy Conservation on a Roller Coaster"
          scale: 1.5
          alignment: "middle"

  - title:
      text: "Roller Coaster Momentum"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Momentum is the product of an object's mass and velocity. Let's explore how momentum affects roller coaster motion!"
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "\\text{p = m*v}"
          alignment: "middle"
      - type: plot_graph
        args:
          points: [[0,0],[10,10],[10,0],[15,15],[15,10]]
          x_label: "Distance (m)"
          y_label: "Momentum (kg*m/s)"
          title: "Momentum on a Roller Coaster"
          scale: 1.5
          alignment: "middle"

  - title:
      text: "Roller Coaster Centripetal Force"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Centripetal force is the force that keeps an object moving in a circular path. Let's explore how centripetal force affects roller coaster motion!"
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "\\text{F_c = m*v^2/r}"
          alignment: "middle"
      - type: plot_graph
        args:
          points: [[0,0],[5,5],[5,0],[10,10],[10,0]]
          x_label: "Distance (m)"
          y_label: "Force (N)"
          title: "Centripetal Force on a Roller Coaster"
          scale: 1.5
          alignment: "middle"

  - title:
      text: "Roller Coaster Loops"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Roller coaster loops are circular tracks that create exciting experiences for riders. Let's explore how physics principles, like centripetal force, allow roller coasters to safely navigate loops!"
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "\\text{F_c = m*v^2/r}"
          alignment: "middle"
      - type: plot_graph
        args:
          points: [[0,0],[5,5],[5,0],[10,15],[10,0]]
          x_label: "Distance (m)"
          y_label: "Force (N)"
          title: "Centripetal Force on a Roller Coaster Loop"
          scale: 1.5
          alignment: "middle"

  - title:
      text: "Roller Coaster Safety"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Safety is a top priority for roller coaster designers. Let's explore how physics principles, like centripetal force and energy conservation, are used to ensure rider safety!"
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "\\text{F_c = m*v^2/r}"
          alignment: "middle"
      - type: plot_graph
        args:
          points: [[0,0],[5,5],[5,0],[10,15],[10,0]]
          x_label: "Distance (m)"
          y_label: "Force (N)"
          title: "Centripetal Force on a Roller Coaster Loop (Safety)"
          scale: 1.5
          alignment: "middle"