
slides:
  - title:
      text: "Energy Transfers in a Roller Coaster"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "A roller coaster stores energy in its potential form at the top of a hill. As it descends, this energy is transferred to kinetic energy. Let's explore this energy transformation!"
          alignment: "left"
      - type: plot_graph
        args:
          points: [[0,0],[10,10],[10,0],[0,0]]
          x_label: "Position"
          y_label: "Potential Energy"
          title: "Potential Energy vs Position"
          scale: 1.5
          alignment: "middle"

  - title:
      text: "Potential Energy: Gravitational Force"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Potential energy is the energy an object has due to its position in a gravitational field. Let's calculate the potential energy of an object at a height h above the ground."
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "PE = mgh"
          alignment: "middle"

  - title:
      text: "Kinetic Energy: Moving Objects"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Kinetic energy is the energy an object has due to its motion. Let's calculate the kinetic energy of an object with mass m moving at velocity v."
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "KE = 0.5mv²"
          alignment: "middle"

  - title:
      text: "Conservation of Mechanical Energy"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "The total mechanical energy of a system remains constant if there are no external forces acting on it. Let's explore this principle with a simple pendulum."
          alignment: "left"
      - type: plot_graph
        args:
          points: [[0,0],[5,5],[5,0],[0,0]]
          x_label: "Angle"
          y_label: "Total Energy"
          title: "Total Energy vs Angle"
          scale: 1.5
          alignment: "middle"

  - title:
      text: "Potential Energy of a Simple Pendulum"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "The potential energy of a simple pendulum is given by the height of the mass above its equilibrium position. Let's calculate the potential energy of a simple pendulum with length l and angle θ."
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "PE = mgh = mgl(1-cos(θ))"
          alignment: "middle"

  - title:
      text: "Kinetic Energy of a Simple Pendulum"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "The kinetic energy of a simple pendulum is given by the velocity of the mass at its lowest point. Let's calculate the kinetic energy of a simple pendulum with length l and angle θ."
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "KE = 0.5ml²ω² = 0.5ml²(2π²/T²)"
          alignment: "middle"

  - title:
      text: "Conservation of Energy in a Simple Pendulum"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "The total energy of a simple pendulum is conserved if there are no external forces acting on it. Let's verify this principle with the given equations."
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "PE + KE = mgl(1-cos(θ)) + 0.5ml²ω² = mgl(1-cos(θ)) + mgl(1-cos(θ)) = mgl"
          alignment: "middle"

  - title:
      text: "Energy Transfers in a Roller Coaster: Recap"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "In a roller coaster, potential energy is converted to kinetic energy as it descends. The total mechanical energy remains constant, ensuring a fun and thrilling ride!"
          alignment: "left"

  - title:
      text: "Energy Transfers in Real Life: Examples"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "In real life, energy transfers occur in various forms, such as a ball rolling down a ramp, a bouncing ball, or a swinging pendulum. Can you identify the potential and kinetic energies in each scenario?"
          alignment: "left"

  - title:
      text: "Energy Transfers in Real Life: Challenge"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Imagine a toy car moving down a ramp. Describe the energy transformation that occurs as the car moves from the top to the bottom of the ramp. Use equations to support your explanation."
          alignment: "left"

  - title:
      text: "Energy Transfers in Real Life: Quiz"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Test your understanding of energy transfers with this quiz question: A ball is thrown upward with an initial velocity of 10 m/s. What is its potential energy at a height of 5 meters?"
          alignment: "left"
      - type: render_latex
        args:
          latex_str: "PE = mgh = m(9.81)(5)"
          alignment: "middle"

  - title:
      text: "Energy Transfers in Real Life: Conclusion"
      alignment: "middle"
    content:
      - type: text
        args:
          text: "Energy transfers are an essential part of our daily lives. Understanding the conversion of potential energy to kinetic energy and vice versa can help us appreciate the world around us."
          alignment: "left"